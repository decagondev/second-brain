# Pen-test findings register (SB-612). See security/README.md.
# Fields: id (PT-nnnn), title, severity (critical|high|medium|low|info), status
# (open|fixed|accepted), laws, found (YYYY-MM-DD), bug (BUG-nnnn, once fixed),
# source (internal|external).
findings:
  - id: PT-0001
    title: The log redactor missed secrets logged URL-escaped, base64 or hex, and under Authorization or Cookie attributes
    severity: high
    status: fixed
    laws: [LAW-07]
    found: 2026-11-19
    bug: BUG-0010
    source: internal
  - id: PT-0002
    title: Role labels written as Markdown headings, quotes or bold (### System:, > assistant:) were not flagged as injection
    severity: medium
    status: fixed
    laws: [LAW-09]
    found: 2026-11-19
    bug: BUG-0011
    source: internal
  - id: PT-0003
    title: A space's scope could reach into a restricted space's scope, making its other members holders of restricted documents
    severity: medium
    status: fixed
    laws: [LAW-20, LAW-19]
    found: 2026-11-20
    bug: BUG-0013
    source: internal
  - id: PT-0004
    title: A file labelled internal at the source and shared with the wrong person is answerable company-wide, because the source's label wins
    severity: medium
    status: accepted
    laws: [LAW-20]
    found: 2026-11-20
    source: internal
  - id: PT-0005
    title: A secret longer than a chunk (a PEM private key) was split by chunking and indexed; common secret forms (AWS secret keys, JWTs, URL credentials, quoted passwords) were missed
    severity: critical
    status: fixed
    laws: [LAW-07]
    found: 2026-11-20
    bug: BUG-0014
    source: internal
  - id: PT-0006
    title: A steward could lower a space's label, or change other values, by hiding a YAML comment in a proposed value
    severity: critical
    status: fixed
    laws: [LAW-16, LAW-20]
    found: 2026-11-20
    bug: BUG-0015
    source: internal
  - id: PT-0007
    title: The manifest diff an operator approves compared lines as a set without their space, so a change could hide behind the same text in another space
    severity: high
    status: fixed
    laws: [LAW-16]
    found: 2026-11-20
    bug: BUG-0015
    source: internal
  - id: PT-0008
    title: Approval rules could be evaded - an edit kept a payment at one approval, edits kept actions alive, a negative amount needed one approval, rejection skipped the duty and reporting-line checks, and a duty ran without reporting lines
    severity: high
    status: fixed
    laws: [LAW-15]
    found: 2026-11-20
    bug: BUG-0016
    source: internal
  - id: PT-0009
    title: Barriers could be evaded - an owner whose sign-in name wasn't their email, barriers in a cell without spaces, approvers across a barrier reading the action, chat asks without directory attributes, and old chunks without an owner
    severity: high
    status: fixed
    laws: [LAW-22]
    found: 2026-11-20
    bug: BUG-0017
    source: internal
  - id: PT-0010
    title: Governance gaps - concurrent decisions overwrote each other, a stale proposal closed unaudited, a sole-steward review could never complete, per-space retention wasn't enforced, a removal could be dropped, a held erasure reported the wrong error, and some SCIM manager forms failed a whole PATCH
    severity: medium
    status: fixed
    laws: [LAW-11, LAW-12, LAW-13, LAW-16]
    found: 2026-11-20
    bug: BUG-0018
    source: internal
  - id: PT-0011
    title: Legal holds and reporting lines are wired by the cell runtime, which isn't built yet; until it is, a caller that leaves them out gets no holds
    severity: medium
    status: accepted
    laws: [LAW-13]
    found: 2026-11-20
    source: internal
  - id: PT-0012
    title: Ingest gaps - one unfetchable document wedged a connector's sync, a removed field allow-list left values indexed, and a sensitive field allowed by one space was readable through every space holding the record
    severity: high
    status: fixed
    laws: [LAW-13, LAW-20]
    found: 2026-11-20
    bug: BUG-0019
    source: internal
  - id: PT-0013
    title: Connector and runtime gaps - GitHub could judge the asker by another member's identity and read only one page, QuickBooks queries stopped at 100 rows, Drive cached folder paths forever, KMS key rings never passed their check, a Cloud Run update reset settings, and a failed shred was never retried
    severity: medium
    status: fixed
    laws: [LAW-03, LAW-13, LAW-18]
    found: 2026-11-20
    bug: BUG-0020
    source: internal
  - id: PT-0014
    title: Change cursors with whole seconds can miss a change in the cursor's own second (GitHub, BambooHR, QuickBooks); opting a repository's source in doesn't backfill existing files; a QuickBooks report may keep an old version
    severity: medium
    status: accepted
    laws: [LAW-13]
    found: 2026-11-20
    source: internal
