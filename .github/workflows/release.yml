name: release
# SB-504: every push to main builds the release twice (the digests must match), writes the
# SPDX SBOM and bundle.json, and signs the bundle digest with cosign keyless (GitHub OIDC,
# Rekor). The signed files are the release's artefacts; cells verify them on admission.
on:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: make lockfiles && git diff --exit-code -- go.mod go.sum vendor web/package-lock.json   # SB-505: lockfiles current
      - run: make release-build
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532   # v4.1.3
      - run: cosign sign-blob --yes --bundle build/release/bundle.sigstore.json build/release/sign.txt
      - run: >-
          cosign verify-blob --bundle build/release/bundle.sigstore.json
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com build/release/sign.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release/a/sb
            build/release/sbom.spdx.json
            build/release/bundle.json
            build/release/sign.txt
            build/release/bundle.sigstore.json
