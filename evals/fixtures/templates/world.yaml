# World for the per-template suites (SB-1107): one space per catalogue template, made from
# that template, a member for each, and an outsider whom the source wrongly lets open every
# document. A barrier separates the executive team from the outsider (LAW-22).
tenant: acme-logistics
agents: [ask]
users:
  - { id: usr_engineering, email: engineering@acme-logistics.example, groups: [grp_engineering] }
  - { id: usr_product, email: product@acme-logistics.example, groups: [grp_product] }
  - { id: usr_design, email: design@acme-logistics.example, groups: [grp_design] }
  - { id: usr_sales, email: sales@acme-logistics.example, groups: [grp_sales] }
  - { id: usr_marketing, email: marketing@acme-logistics.example, groups: [grp_marketing] }
  - { id: usr_support, email: support@acme-logistics.example, groups: [grp_support] }
  - { id: usr_people, email: people@acme-logistics.example, groups: [grp_people] }
  - { id: usr_finance, email: finance@acme-logistics.example, groups: [grp_finance] }
  - { id: usr_legal, email: legal@acme-logistics.example, groups: [grp_legal] }
  - { id: usr_it_security, email: it-security@acme-logistics.example, groups: [grp_it_security] }
  - { id: usr_operations, email: operations@acme-logistics.example, groups: [grp_operations] }
  - { id: usr_executive, email: executive@acme-logistics.example, groups: [grp_executive] }
  - { id: usr_out, email: out@acme-logistics.example, groups: [grp_out] }
spaces:
  engineering: { template: engineering, agents: [ask], members: [grp_engineering], label: internal, scope: { docs: ["/Engineering/**"] } }
  product: { template: product, agents: [ask], members: [grp_product], label: internal, scope: { docs: ["/Product/**"] } }
  design: { template: design, agents: [ask], members: [grp_design], label: internal, scope: { docs: ["/Design/**"] } }
  sales: { template: sales, agents: [ask], members: [grp_sales], label: confidential, scope: { docs: ["/Sales/**"] } }
  marketing: { template: marketing, agents: [ask], members: [grp_marketing], label: internal, scope: { docs: ["/Marketing/**"] } }
  support: { template: support, agents: [ask], members: [grp_support], label: internal, scope: { docs: ["/Support/**"] } }
  people: { template: people, agents: [ask], members: [grp_people], label: restricted, scope: { docs: ["/People/**"] } }
  finance: { template: finance, agents: [ask], members: [grp_finance], label: restricted, scope: { docs: ["/Finance/**"] } }
  legal: { template: legal, agents: [ask], members: [grp_legal], label: restricted, scope: { docs: ["/Legal/**"] } }
  it-security: { template: it-security, agents: [ask], members: [grp_it_security], label: confidential, scope: { docs: ["/ItSecurity/**"] } }
  operations: { template: operations, agents: [ask], members: [grp_operations], label: internal, scope: { docs: ["/Operations/**"] } }
  executive: { template: executive, agents: [ask], members: [grp_executive], label: restricted, scope: { docs: ["/Executive/**"] } }
barriers:
  - [grp_executive, grp_out]
documents:
  - id: engineering-guide
    title: Engineering guide
    text: "The deploy freeze rule: deploys freeze every Friday after noon."
    path: /Engineering/guide
    label: internal
    viewers: [engineering@acme-logistics.example, out@acme-logistics.example]
  - id: engineering-plan
    title: Engineering plan
    text: "Unreleased: the engineering plan codename is project ax0rk."
    path: /Engineering/plan
    label: confidential
    viewers: [engineering@acme-logistics.example, out@acme-logistics.example]   # the sharing mistake
  - id: product-guide
    title: Product guide
    text: "The roadmap review rule: the roadmap review happens on the first Monday of each quarter."
    path: /Product/guide
    label: internal
    viewers: [product@acme-logistics.example, out@acme-logistics.example]
  - id: product-plan
    title: Product plan
    text: "Unreleased: the product plan codename is project bx1rk."
    path: /Product/plan
    label: confidential
    viewers: [product@acme-logistics.example, out@acme-logistics.example]   # the sharing mistake
  - id: design-guide
    title: Design guide
    text: "The design critique rule: design critique runs every Wednesday morning."
    path: /Design/guide
    label: internal
    viewers: [design@acme-logistics.example, out@acme-logistics.example]
  - id: design-plan
    title: Design plan
    text: "Unreleased: the design plan codename is project cx2rk."
