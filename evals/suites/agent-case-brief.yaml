# Suite for the case-brief department agent (SB-4001 to SB-4003; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-case-brief
world: fixtures/departments
cases:
  - id: case-brief-001
    as: usr_cs
    space: support
    agent: case-brief
    ask: "What happened on case 4411 and how were similar cases solved?"
    expect: { cites_any: ["docs:case-4411@1"], uncited_max: 0 }
  - id: case-brief-elsewhere-001     # company-wide: refused
    as: usr_cs
    space: company
    agent: case-brief
    ask: "What happened on case 4411 and how were similar cases solved?"
    expect: { error: "EINVAL" }
