# Suite for the close-checklist department agent (SB-1102; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-close-checklist
world: fixtures/departments
cases:
  - id: close-checklist-001
    as: usr_fin
    space: finance
    agent: close-checklist
    ask: "Which November close items are done and which are open?"
    expect: { cites_any: ["docs:close-nov@1"], uncited_max: 0 }
  - id: close-checklist-elsewhere-001     # another template's space, or company-wide: refused
    as: usr_fin
    space: company
    agent: close-checklist
    ask: "Which November close items are done and which are open?"
    expect: { error: "EINVAL" }
