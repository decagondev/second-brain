# Suite for the design-rationale department agent (SB-4001 to SB-4003; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-design-rationale
world: fixtures/departments
cases:
  - id: design-rationale-001
    as: usr_ux
    space: design
    agent: design-rationale
    ask: "Why does the tracking page show one status line?"
    expect: { cites_any: ["docs:design-tracking@1"], uncited_max: 0 }
  - id: design-rationale-elsewhere-001     # company-wide: refused
    as: usr_ux
    space: company
    agent: design-rationale
    ask: "Why does the tracking page show one status line?"
    expect: { error: "EINVAL" }
