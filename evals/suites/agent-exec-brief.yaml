# Suite for the exec-brief department agent (SB-4001 to SB-4003; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-exec-brief
world: fixtures/departments
cases:
  - id: exec-brief-001
    as: usr_ceo
    space: executive
    agent: exec-brief
    ask: "What did the leadership team decide this month and what is open?"
    expect: { cites_any: ["docs:minutes-nov@1"], uncited_max: 0 }
  - id: exec-brief-elsewhere-001     # company-wide: refused
    as: usr_ceo
    space: company
    agent: exec-brief
    ask: "What did the leadership team decide this month and what is open?"
    expect: { error: "EINVAL" }
