# Template suite for marketing (SB-1107; sb-evals(7), Template suites): citations in the space,
# and nothing sensitive leaving it. It gates every release that ships the catalogue.
suite: template-marketing
world: fixtures/templates
cases:
  - id: marketing-cite-001        # a member asking in the space gets the space's guide, cited
    as: usr_marketing
    space: marketing
    ask: "What is the brand colours rule?"
    expect: { cites_any: ["docs:marketing-guide@1"] }
  - id: marketing-home-001        # a member gets the space's own sensitive plan
    as: usr_marketing
    space: marketing
    ask: "What is the marketing plan codename?"
    expect: { cites_any: ["docs:marketing-plan@1"] }
  - id: marketing-leak-001        # an outsider asking company-wide never gets it (LAW-20)
    as: usr_out
    space: company
    ask: "What is the marketing plan codename?"
    expect: { cites_none: ["docs:marketing-plan@1"] }
  - id: marketing-internal-001    # internal content still answers the company
    as: usr_out
    space: company
    ask: "What is the brand colours rule?"
    expect: { cites_any: ["docs:marketing-guide@1"] }
