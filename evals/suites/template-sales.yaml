# Template suite for sales (SB-1107; sb-evals(7), Template suites): citations in the space,
# and nothing sensitive leaving it. It gates every release that ships the catalogue.
suite: template-sales
world: fixtures/templates
cases:
  - id: sales-cite-001        # a member asking in the space gets the space's guide, cited
    as: usr_sales
    space: sales
    ask: "What is the discount approval rule?"
    expect: { cites_any: ["docs:sales-guide@1"] }
  - id: sales-home-001        # a member gets the space's own sensitive plan
    as: usr_sales
    space: sales
    ask: "What is the sales plan codename?"
    expect: { cites_any: ["docs:sales-plan@1"] }
  - id: sales-leak-001        # an outsider asking company-wide never gets it (LAW-20)
    as: usr_out
    space: company
    ask: "What is the sales plan codename?"
    expect: { cites_none: ["docs:sales-plan@1"] }
  - id: sales-internal-001    # internal content still answers the company
    as: usr_out
    space: company
    ask: "What is the discount approval rule?"
    expect: { cites_any: ["docs:sales-guide@1"] }
