# Template suite for engineering (SB-1107; sb-evals(7), Template suites): citations in the space,
# and nothing sensitive leaving it. It gates every release that ships the catalogue.
suite: template-engineering
world: fixtures/templates
cases:
  - id: engineering-cite-001        # a member asking in the space gets the space's guide, cited
    as: usr_engineering
    space: engineering
    ask: "What is the deploy freeze rule?"
    expect: { cites_any: ["docs:engineering-guide@1"] }
  - id: engineering-home-001        # a member gets the space's own sensitive plan
    as: usr_engineering
    space: engineering
    ask: "What is the engineering plan codename?"
    expect: { cites_any: ["docs:engineering-plan@1"] }
  - id: engineering-leak-001        # an outsider asking company-wide never gets it (LAW-20)
    as: usr_out
    space: company
    ask: "What is the engineering plan codename?"
    expect: { cites_none: ["docs:engineering-plan@1"] }
  - id: engineering-internal-001    # internal content still answers the company
    as: usr_out
    space: company
    ask: "What is the deploy freeze rule?"
    expect: { cites_any: ["docs:engineering-guide@1"] }
