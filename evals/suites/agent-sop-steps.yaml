# Suite for the sop-steps department agent (SB-4001 to SB-4003; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-sop-steps
world: fixtures/departments
cases:
  - id: sop-steps-001
    as: usr_opsm
    space: operations
    agent: sop-steps
    ask: "What are the steps of the returns procedure?"
    expect: { cites_any: ["docs:sop-returns@1"], uncited_max: 0 }
  - id: sop-steps-elsewhere-001     # company-wide: refused
    as: usr_opsm
    space: company
    agent: sop-steps
    ask: "What are the steps of the returns procedure?"
    expect: { error: "EINVAL" }
