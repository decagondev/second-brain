# Template suite for design (SB-1107; sb-evals(7), Template suites): citations in the space,
# and nothing sensitive leaving it. It gates every release that ships the catalogue.
suite: template-design
world: fixtures/templates
cases:
  - id: design-cite-001        # a member asking in the space gets the space's guide, cited
    as: usr_design
    space: design
    ask: "What is the design critique rule?"
    expect: { cites_any: ["docs:design-guide@1"] }
  - id: design-home-001        # a member gets the space's own sensitive plan
    as: usr_design
    space: design
    ask: "What is the design plan codename?"
    expect: { cites_any: ["docs:design-plan@1"] }
  - id: design-leak-001        # an outsider asking company-wide never gets it (LAW-20)
    as: usr_out
    space: company
    ask: "What is the design plan codename?"
    expect: { cites_none: ["docs:design-plan@1"] }
  - id: design-internal-001    # internal content still answers the company
    as: usr_out
    space: company
    ask: "What is the design critique rule?"
    expect: { cites_any: ["docs:design-guide@1"] }
