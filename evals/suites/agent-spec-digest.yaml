# Suite for the spec-digest department agent (SB-1102; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-spec-digest
world: fixtures/departments
cases:
  - id: spec-digest-001
    as: usr_pm
    space: product
    agent: spec-digest
    ask: "What does the routing spec decide about parcels?"
    expect: { cites_any: ["docs:spec-routing@1"], uncited_max: 0 }
  - id: spec-digest-elsewhere-001     # another template's space, or company-wide: refused
    as: usr_eng
    space: engineering
    agent: spec-digest
    ask: "What does the routing spec decide about parcels?"
    expect: { error: "EINVAL" }
