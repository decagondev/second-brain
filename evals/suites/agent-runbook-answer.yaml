# Suite for the runbook-answer department agent (SB-1102; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-runbook-answer
world: fixtures/departments
cases:
  - id: runbook-answer-001
    as: usr_ops
    space: it-security
    agent: runbook-answer
    ask: "What are the steps for a VPN outage?"
    expect: { cites_any: ["docs:runbook-vpn@1"], uncited_max: 0 }
  - id: runbook-answer-elsewhere-001     # another template's space, or company-wide: refused
    as: usr_eng
    space: engineering
    agent: runbook-answer
    ask: "What are the steps for a VPN outage?"
    expect: { error: "EINVAL" }
