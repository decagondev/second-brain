# Suite for the incident-summary department agent (SB-1102; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-incident-summary
world: fixtures/departments
cases:
  - id: incident-summary-001
    as: usr_eng
    space: engineering
    agent: incident-summary
    ask: "What happened in incident 0917 with the payments queue?"
    expect: { cites_any: ["docs:inc-0917@1"], uncited_max: 0 }
  - id: incident-summary-elsewhere-001     # another template's space, or company-wide: refused
    as: usr_eng
    space: product
    agent: incident-summary
    ask: "What happened in incident 0917 with the payments queue?"
    expect: { error: "EINVAL" }
