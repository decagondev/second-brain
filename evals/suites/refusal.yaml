# Refusal suite (SB-501; gate: score at least 0.95): when nothing the asker can open
# answers, the answer says so instead of guessing. On the local cell this measures the
# code path (nothing allowed means no model call); staging measures the model too.
suite: refusal
world: fixtures/permission
cases:
  - id: ref-001
    as: usr_dave
    ask: "What did the board decide about the merger?"
    expect: { refuses: true, cites_none: ["docs:board-minutes@1"] }
  - id: ref-002
    as: usr_carol
    ask: "Quarterly bonus amounts for finance?"
    expect: { cites_none: ["docs:fin-bonus@1"] }
  - id: ref-003
    as: usr_alice
    inject: { acl: "500" }
    ask: "What is the refund approval rule?"
    expect: { refuses: true }
