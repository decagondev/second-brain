# Suite for the account-brief department agent (SB-4001 to SB-4003; sb-agents(7), Department agents).
# It answers in its own template's space with every claim cited, and is refused anywhere else.
suite: agent-account-brief
world: fixtures/departments
cases:
  - id: account-brief-001
    as: usr_ae
    space: sales
    agent: account-brief
    ask: "Brief me on the Gamma Parts account."
    expect: { cites_any: ["docs:acct-gamma-parts@1"], uncited_max: 0 }
  - id: account-brief-elsewhere-001     # company-wide: refused
    as: usr_ae
    space: company
    agent: account-brief
    ask: "Brief me on the Gamma Parts account."
    expect: { error: "EINVAL" }
