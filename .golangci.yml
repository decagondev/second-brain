# golangci-lint v2. Rules from docs/06-engineering-standards.md.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - depguard      # SB-008: the dependency rule
    - exhaustive    # every switch on an enum (e.g. policy.Decision) handles every value
    - forbidigo     # no fmt.Print*/log.* outside cmd/
    # SB-1403: clean and concise.
    - errorlint     # errors compared and asserted with errors.Is/As
    - nilerr        # an error turned into nil is said out loud (//nolint:nilerr with why)
    - unparam       # no parameter or result that never varies
    - wastedassign  # no value assigned and then overwritten unread
    - gocritic      # the default checks: off-by-ones, append mistakes and the like
    - bodyclose     # every HTTP response body closed
    - misspell
    - unconvert
    - nakedret
    - dupl          # no copied blocks of code
    - gocyclo       # no function too tangled to review
  settings:
    depguard:
      rules:
        core:
          list-mode: strict
          files: ["**/internal/core/**/*.go"]
          allow: ["$gostd", "example.com/second-brain/internal/core"]
        ports:
          list-mode: strict
          files: ["**/internal/core/ports/*.go"]
          allow: ["$gostd", "example.com/second-brain/internal/core/tenancy"]
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
        - pattern: ^log\.
    errorlint:
      errorf: false # %v is used on purpose where an error must not be unwrapped by callers
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 40
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters: [forbidigo]
      - path: ^cmd/
        linters: [forbidigo]
      # Tests, law tests and fakes are long tables and scenarios by design.
      - path: (_test\.go|^laws/|test/[a-z]+\.go$|gcptest|lineartest|hubspottest)
        linters: [dupl, gocyclo, unparam]
formatters:
  enable: [gofmt]
