# A self-hosted cell (sb-selfhost(7); ADR-0022, SB-1602 to SB-1605): one container per
# service, laid out the way GCP lays out a cell. tools/selfhost/selfhost.sh writes
# ../../build/selfhost (the configuration, the vaults, the Caddyfile and compose.env, which
# carries every ${…} below) and fills the volumes before this runs. Run it through
# tools/selfhost/compose.sh, which passes compose.env and the install's profiles. Images
# come from `make images` or an install bundle, and after the first upgrade from the
# digests the updater admitted (SB_*_IMAGE). No container mounts the Docker socket.
name: sb-selfhost

x-cell: &cell
  user: "65532:65532"
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment:
    # The system's roots, plus the CA of a proxy certificate the cell must trust to reach
    # its own sign-in (Caddy's local CA, or a company CA), copied in by selfhost.sh.
    SSL_CERT_DIR: /etc/ssl/certs:/etc/sb/ca
    # The company's outbound proxy (SB-1806), for these four services only: postgres, the
    # model and the write-once store have no route out. A proxy with credentials comes
    # from a file in the service's own vault (SB_PROXY_FILE), never from the environment.
    HTTPS_PROXY: ${SB_HTTPS_PROXY:-}
    NO_PROXY: ${SB_NO_PROXY_LIST:-}
    SB_HTTPS_PROXY_FILE: ${SB_PROXY_FILE:-}
  depends_on:
    # The bundled database (profile db); SB_DATABASE=external leaves it out (SB-1807).
    postgres: { condition: service_healthy, required: false }
    worm: { condition: service_started }

x-hardened: &hardened
  user: "65532:65532"
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  proxy:            # the HTTPS load balancer: the only published port for the cell
    image: caddy@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    restart: unless-stopped
    ports: ["${SB_BIND:-127.0.0.1}:${SB_PORT:-8443}:${SB_PORT:-8443}", "${SB_BIND:-127.0.0.1}:${SB_HTTP_PORT:-8080}:80"]
    volumes:
      - ../../build/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../build/selfhost/tls:/etc/sb/tls:ro
      - caddy:/data
    networks:
      # The cell reaches its own sign-in at its public name, through this proxy.
      edge: { aliases: ["${SB_HOST:-cell.localhost}"] }
      egress: { aliases: ["${SB_HOST:-cell.localhost}"] }   # ingest and jobs build the sign-in too

  api:
    <<: *cell
    image: ${SB_API_IMAGE:-sb-api:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - ../../build/selfhost/ca:/etc/sb/ca:ro
      - state:/var/lib/sb/state
      - vault-api:/var/lib/sb/vault
      - ${SB_SHARE:-../../examples/share}:/srv/share:ro   # the docs: folder share (SB-1606)
      # Stewards' notes (SB-1705): the one folder of the share api may write, and only api.
      - ${SB_NOTES:-notes}:/srv/share/notes
    networks: [edge, data, egress]

  ingest:
    <<: *cell
    image: ${SB_INGEST_IMAGE:-sb-ingest:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - ../../build/selfhost/ca:/etc/sb/ca:ro
      - state:/var/lib/sb/state
      - vault-ingest:/var/lib/sb/vault
      - ${SB_SHARE:-../../examples/share}:/srv/share:ro
      - ${SB_NOTES:-notes}:/srv/share/notes:ro
    networks: [data, egress]

  jobs:
    <<: *cell
    image: ${SB_JOBS_IMAGE:-sb-jobs:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - ../../build/selfhost/ca:/etc/sb/ca:ro
      - state:/var/lib/sb/state
      - vault-jobs:/var/lib/sb/vault
      - ${SB_SHARE:-../../examples/share}:/srv/share:ro
      - ${SB_NOTES:-notes}:/srv/share/notes:ro
      # The backup's off-box copy: a directory on another machine, mounted on the host (SB-1605).
      - ${SB_OFFSITE:-../../build/selfhost/.offsite}:/srv/backup-offsite
    networks: [data, egress]

  updater:          # the updater job: run by the host step on a timer, never always on (SB-1604)
    <<: *cell
    image: ${SB_UPDATER_IMAGE:-sb-updater:local}
    profiles: [update]
    restart: "no"
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - ../../build/selfhost/ca:/etc/sb/ca:ro
      - state:/var/lib/sb/state
      - releases:/var/lib/sb/releases:ro
      - vault-updater:/var/lib/sb/vault
    networks: [data, egress]

  worm:             # the WORM bucket: S3 with compliance-mode object lock, on the box (SB-1603)
    image: versity/versitygw@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /data/objects /data/versions && ROOT_ACCESS_KEY=sb-worm ROOT_SECRET_KEY=$$(cat /run/sb/worm-secret) exec versitygw posix --versioning-dir /data/versions /data/objects"]
    volumes:
      - worm-data:/data
      - ../../build/selfhost/worm-secret:/run/sb/worm-secret:ro
    networks: [data]

  wormsetup:        # one shot at install: the bucket, its seven-year lock, and a probe that proves it
    <<: *hardened
    image: sb-wormsetup:local
    profiles: [setup]
    restart: "no"
    command: ["--endpoint", "http://worm:7070", "--bucket", "sb-worm", "--creds-file", "/run/sb/worm-creds"]
    volumes:
      # Its own copy of the jobs vault's worm key, owned by 65532 (selfhost.sh fills it): a
      # bind mount of the owner-only vault file can't be read by the service user.
      - run-wormsetup:/run/sb:ro
    networks: [data]
    depends_on: [worm]

  postgres:         # Cloud SQL, private IP: on the internal network only
    image: pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    profiles: [db]  # compose.sh adds it unless SB_DATABASE=external
    restart: unless-stopped
    environment:
      POSTGRES_USER: sb
      POSTGRES_DB: sb
      POSTGRES_PASSWORD_FILE: /run/sb/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../build/selfhost/db-password:/run/sb/db-password:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sb"]
      interval: 2s
      timeout: 3s
      retries: 30

  idp:              # the bundled IdP, sb-idp(1): passwords, behind the proxy at /idp (SB-1605)
    <<: *hardened
    image: sb-idp:local
    profiles: [bundled]
    command: ["serve", "--issuer", "${SB_ISSUER:-https://cell.localhost:8443/idp}", "--data", "/var/lib/sb-idp",
              "--tenant", "${SB_TENANT:-acme-logistics}", "--client", "sb-${SB_TENANT:-acme-logistics}", "--secret-file", "/run/sb/oidc",
              "--redirect", "${SB_BASE_URL:-https://cell.localhost:8443}/callback", "--behind-proxy"]
    volumes:
      - idp-data:/var/lib/sb-idp
      # oidc and scim, copied from the api vault into a volume owned by 65532 (selfhost.sh).
      - run-idp:/run/sb:ro
    networks: [edge]

  # A model on the box (SB-1710, profile model): llama.cpp's server, one image pinned by
  # digest (SB_MODEL_IMAGE, set by tools/selfhost/model.sh), weights read-only, on the data
  # network only: no route out, no published port, no secret.
  model:
    <<: *hardened
    image: ${SB_MODEL_IMAGE:-sb-model-image-unset}
    profiles: [model]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/model.gguf", "--ctx-size", "8192", "--no-webui"]
    volumes: ["models:/models:ro"]
    networks: [data]

  model-embed:
    <<: *hardened
    image: ${SB_MODEL_IMAGE:-sb-model-image-unset}
    profiles: [model]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/embed.gguf", "--embeddings", "--no-webui"]
    volumes: ["models:/models:ro"]
    networks: [data]

  devidp:           # development only: the IdP with no passwords, on this machine's loopback
    <<: *hardened
    image: sb-devidp:local
    profiles: [dev]
    command: ["--demo", "--listen", "0.0.0.0:8081", "--issuer", "http://idp.localhost:8081",
              "--tenant", "${SB_TENANT:-acme-logistics}", "--client", "sb-${SB_TENANT:-acme-logistics}", "--secret-file", "/run/sb/oidc"]
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - run-idp:/run/sb:ro
    networks:
      egress: { aliases: [idp.localhost] }

networks:
  edge: {}
  data: { internal: true }
  egress: {}

volumes:
  state: {}
  vault-api: {}
  vault-ingest: {}
  vault-jobs: {}
  vault-updater: {}
  releases: {}
  worm-data: {}
  idp-data: {}
  run-idp: {}        # the IdP's two secrets, out of the api vault (selfhost.sh)
  run-wormsetup: {}  # wormsetup's worm key, out of the jobs vault (selfhost.sh)
  pgdata: {}
  caddy: {}
  models: {}  # the model profile's weights, copied in by tools/selfhost/model.sh (SB-1710)
  notes: {}   # stewards' notes, unless SB_NOTES names the share's own notes/ folder
