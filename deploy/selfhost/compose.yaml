# A self-hosted cell (sb-selfhost(7); ADR-0022, SB-1602 to SB-1604): one container per
# service, laid out the way GCP lays out a cell. `make selfhost` writes ../../build/selfhost
# and fills the volumes before this runs; images come from `make images`, and after the
# first upgrade from the digests the updater admitted (SB_*_IMAGE, written by the host
# step into ../../build/selfhost/images.env). No container mounts the Docker socket.
name: sb-selfhost

x-cell: &cell
  user: "65532:65532"
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment:
    SSL_CERT_DIR: /etc/ssl/certs
  volumes:
    - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
    - ../../build/selfhost/policy:/etc/sb/policy:ro
    - state:/var/lib/sb/state
  depends_on:
    postgres: { condition: service_healthy }
    worm: { condition: service_started }
    idp: { condition: service_started }

services:
  proxy:            # the HTTPS load balancer: the only published port for the cell
    image: caddy@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks: [edge]
    depends_on: [api]

  api:
    <<: *cell
    image: ${SB_API_IMAGE:-sb-api:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - state:/var/lib/sb/state
      - vault-api:/var/lib/sb/vault
    networks: [edge, data, egress]

  ingest:
    <<: *cell
    image: ${SB_INGEST_IMAGE:-sb-ingest:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - state:/var/lib/sb/state
      - vault-ingest:/var/lib/sb/vault
    networks: [data, egress]

  jobs:
    <<: *cell
    image: ${SB_JOBS_IMAGE:-sb-jobs:local}
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - state:/var/lib/sb/state
      - vault-jobs:/var/lib/sb/vault
    networks: [data, egress]

  updater:          # the updater job: run by the host step on a timer, never always on (SB-1604)
    <<: *cell
    image: ${SB_UPDATER_IMAGE:-sb-updater:local}
    profiles: [update]
    restart: "no"
    command: ["--config", "/etc/sb/cell.json"]
    volumes:
      - ../../build/selfhost/cell.json:/etc/sb/cell.json:ro
      - ../../build/selfhost/policy:/etc/sb/policy:ro
      - state:/var/lib/sb/state
      - releases:/var/lib/sb/releases:ro
      - vault-updater:/var/lib/sb/vault
    networks: [data]

  worm:             # the WORM bucket: S3 with compliance-mode object lock, on the box (SB-1603)
    image: versity/versitygw@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /data/objects /data/versions && ROOT_ACCESS_KEY=sb-worm ROOT_SECRET_KEY=$$(cat /run/sb/worm-secret) exec versitygw posix --versioning-dir /data/versions /data/objects"]
    volumes:
      - worm-data:/data
      - ../../build/selfhost/worm-secret:/run/sb/worm-secret:ro
    networks: [data]

  wormsetup:        # one shot at install: the bucket, its seven-year lock, and a probe that proves it
    image: sb-wormsetup:local
    profiles: [setup]
    user: "65532:65532"
    read_only: true
    command: ["--endpoint", "http://worm:7070", "--bucket", "sb-worm", "--creds-file", "/run/sb/worm-creds"]
    volumes:
      - ../../build/selfhost/vault/jobs/vault/tenants/acme-logistics/worm:/run/sb/worm-creds:ro
    networks: [data]
    depends_on: [worm]

  postgres:         # Cloud SQL, private IP: on the internal network only
    image: pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_USER: sb
      POSTGRES_DB: sb
      POSTGRES_PASSWORD_FILE: /run/sb/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../build/selfhost/db-password:/run/sb/db-password:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sb"]
      interval: 2s
      timeout: 3s
      retries: 30

  idp:              # demo only: the development IdP, published on this machine's loopback
    image: sb-devidp:local
    user: "65532:65532"
    read_only: true
    command: ["--demo", "--listen", "0.0.0.0:8081", "--issuer", "http://idp.localhost:8081",
              "--tenant", "acme-logistics", "--client", "sb-acme-logistics", "--secret-file", "/run/sb/oidc"]
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - ../../build/selfhost/vault/api/vault/tenants/acme-logistics/oidc:/run/sb/oidc:ro
    networks:
      egress: { aliases: [idp.localhost] }

networks:
  edge: {}
  data: { internal: true }
  egress: {}

volumes:
  state: {}
  vault-api: {}
  vault-ingest: {}
  vault-jobs: {}
  vault-updater: {}
  releases: {}
  worm-data: {}
  pgdata: {}
  caddy: {}
